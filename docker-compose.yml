services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # This service has no fixed container name or host port, so Compose can
    # create independent worker processes with: --scale worker=<count>.
    init: true
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-10}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-1}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 65s

volumes:
  postgres_data:
